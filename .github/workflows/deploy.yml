name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build VitePress docs
        run: npx vitepress build docs

      - name: Assemble site
        run: |
          mkdir -p _site
          # Landing at root
          cp -r landing/. _site/
          # Docs under /docs/
          mkdir -p _site/docs
          cp -r docs/.vitepress/dist/. _site/docs/
          # Root CNAME (for mitm.sud-o.app — main domain)
          echo "mitm.sud-o.app" > _site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
